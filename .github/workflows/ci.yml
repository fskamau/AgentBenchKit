name: agentbenchkit-ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: python -m pytest tests -q --cov=agentbenchkit --cov-report=term-missing --cov-report=json:coverage.json
      - run: python -m build --sdist --wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.json
          if-no-files-found: ignore

  docker-smoke:
    name: Restricted Docker benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: docker pull python:3.11-slim
      - run: agentbenchkit benchmark run pagination-boundary --engine docker --output reports-out/docker-smoke
      - name: Assert patch outcome
        run: |
          python - <<'PY'
          import json
          with open('reports-out/docker-smoke.json') as file:
              result = json.load(file)
          assert result['classification'] == 'verified_by_tests', result
          assert result['patched']['classification'] == 'passed', result
          PY
