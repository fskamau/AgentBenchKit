[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbenchkit"
version = "0.1.0"
description = "Evidence-linked coding-agent trajectory scoring and isolated patch verification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name="AgentBenchKit contributors"}]
dependencies = ["pydantic>=2.5,<3", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "build>=1.0"]

[project.scripts]
agentbenchkit = "agentbenchkit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: requires a functioning Docker daemon", "integration: runs local temporary benchmark fixtures"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["agentbenchkit"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
